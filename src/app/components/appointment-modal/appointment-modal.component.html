<!-- Appointment Modal -->
<div
  id="appointment-modal"
  class="modal fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50"
  [class.hidden]="!isModalOpen"
  [class.active]="isModalOpen"
>
  <div
    class="modal-content bg-white rounded-xl p-6 max-w-lg w-full relative card-shadow"
  >
    <button
      (click)="closeModal()"
      class="absolute top-4 right-4 text-gray-600 hover:text-gray-900 text-2xl font-bold"
    >
      &times;
    </button>
    <h2 class="text-xl font-bold text-primary-teal mb-4 text-center">
      Book Your Appointment
    </h2>
    <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label
          for="patient-name"
          class="block text-gray-700 text-sm font-bold mb-1"
          >Your Name</label
        >
        <input
          type="text"
          id="patient-name"
          formControlName="patientName"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-primary-teal rounded-md"
          placeholder="Full Name"
          required
        />
      </div>
      <div class="mb-3">
        <label
          for="patient-phone"
          class="block text-gray-700 text-sm font-bold mb-1"
          >Phone Number</label
        >
        <input
          type="tel"
          id="patient-phone"
          formControlName="patientPhone"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-primary-teal rounded-md"
          placeholder="e.g., +91-1234567890"
          required
        />
      </div>
      <div class="mb-3">
        <label
          for="patient-email"
          class="block text-gray-700 text-sm font-bold mb-1"
          >Email Address (Optional)</label
        >
        <input
          type="email"
          id="patient-email"
          formControlName="patientEmail"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-primary-teal rounded-md"
          placeholder="your.email&#64;example.com"
        />
      </div>
      <div class="mb-3">
        <label
          for="appointment-date"
          class="block text-gray-700 text-sm font-bold mb-1"
          >Preferred Date</label
        >
        <input
          type="date"
          id="appointment-date"
          formControlName="appointmentDate"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-primary-teal rounded-md"
          required
        />
      </div>
      <div class="mb-3">
        <label
          for="appointment-time"
          class="block text-gray-700 text-sm font-bold mb-1"
          >Preferred Time</label
        >
        <input
          type="time"
          id="appointment-time"
          formControlName="appointmentTime"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-primary-teal rounded-md"
          required
        />
      </div>
      <div class="mb-4">
        <label
          for="clinic-location"
          class="block text-gray-700 text-sm font-bold mb-1"
          >Choose Clinic Location</label
        >
        <select
          id="clinic-location"
          formControlName="clinicLocation"
          class="shadow border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-primary-teal rounded-md"
          required
        >
          <option value="">Select a location</option>
          <option value="Genova Clinic, Malviya Nagar & Saket">
            Genova Clinic, Malviya Nagar & Saket
          </option>
          <option value="Chronus Hospital, Chattarpur">
            Chronus Hospital, Chattarpur
          </option>
          <option value="Katwaria Sarai & Shahpurjat">
            Katwaria Sarai & Shahpurjat
          </option>
          <option value="Devli & Khanpur">Devli & Khanpur</option>
          <option
            value="Max Superspeciality Hospital, Panchsheel Park (Visiting)"
          >
            Max Superspeciality Hospital, Panchsheel Park (Visiting Consultant)
          </option>
        </select>
      </div>
      <div class="mb-4">
        <label
          for="reason-for-visit"
          class="block text-gray-700 text-sm font-bold mb-1"
          >Reason for Visit (Optional)</label
        >
        <textarea
          id="reason-for-visit"
          formControlName="reasonForVisit"
          rows="3"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-primary-teal rounded-md"
          placeholder="Briefly describe your reason for appointment"
        ></textarea>
      </div>
      <div class="flex items-center justify-center">
        <button
          type="submit"
          class="btn-book-now px-6 py-3 rounded-full font-bold text-base"
        >
          Confirm Appointment
        </button>
      </div>
    </form>
    <div
      id="modal-message-box"
      class="mt-3 p-3 rounded-md text-sm text-center"
      [class.hidden]="!modalMessage"
      [class.bg-green-100]="modalMessage?.type === 'success'"
      [class.text-green-700]="modalMessage?.type === 'success'"
      [class.bg-red-100]="modalMessage?.type === 'error'"
      [class.text-red-700]="modalMessage?.type === 'error'"
      role="alert"
    >
      {{ modalMessage?.message }}
    </div>
  </div>
</div>
